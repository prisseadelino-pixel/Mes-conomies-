<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Économies</title>
    
    <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">
    <link rel="apple-touch-icon" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">

    <style>
        :root {
            --primary-color: #2ecc71;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .logo-display {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            display: block;
        }

        .result-box {
            background-color: var(--background-color);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 0.5rem;
        }

        .amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .settings {
            text-align: left;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .info {
            font-size: 0.8rem;
            color: #95a5a6;
            margin-top: 1rem;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png" alt="Logo" class="logo-display">
    <h1>Mes Économies</h1>
    
    <div class="result-box">
        <div class="label">Solde actuel estimé</div>
        <div class="amount" id="soldeAffiche">0 €</div>
    </div>

    <div class="settings">
        <div class="input-group">
            <label for="montantInitial">Solde au départ (€)</label>
            <input type="number" id="montantInitial" value="1000">
        </div>
        <div class="input-group">
            <label for="ajoutMensuel">Ajout chaque mois (€)</label>
            <input type="number" id="ajoutMensuel" value="100">
        </div>
        <div class="input-group">
            <label for="dateDepart">Date du premier versement</label>
            <input type="date" id="dateDepart" value="2026-01-01">
        </div>
    </div>

    <div class="info" id="detailCalcul"></div>
</div>

<script>
    const inputs = ['montantInitial', 'ajoutMensuel', 'dateDepart'];

    // Charger les données sauvegardées
    function chargerSauvegarde() {
        inputs.forEach(id => {
            const sauvegarde = localStorage.getItem(id);
            if (sauvegarde) document.getElementById(id).value = sauvegarde;
        });
    }

    function calculer() {
        const initial = parseFloat(document.getElementById('montantInitial').value) || 0;
        const mensuel = parseFloat(document.getElementById('ajoutMensuel').value) || 0;
        const debut = new Array(document.getElementById('dateDepart').value);
        
        // Sauvegarde immédiate
        inputs.forEach(id => localStorage.setItem(id, document.getElementById(id).value));

        const dateDebut = new Date(document.getElementById('dateDepart').value);
        const dateAujourdhui = new Date();

        // Calcul du nombre de mois écoulés
        let mois = (dateAujourdhui.getFullYear() - dateDebut.getFullYear()) * 12;
        mois += dateAujourdhui.getMonth() - dateDebut.getMonth();

        // On ne compte pas de mois négatif si la date est dans le futur
        if (mois < 0) mois = 0;

        const total = initial + (mois * mensuel);
        
        document.getElementById('soldeAffiche').innerText = total.toLocaleString('fr-FR') + " €";
        document.getElementById('detailCalcul').innerText = `Calculé sur ${mois} mois écoulés.`;
    }

    // Écouter les changements
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('input', calculer);
    });

    // Lancement
    chargerSauvegarde();
    calculer();
</script>

</body>
</html>
