<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Économies</title>
    
    <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">
    <link rel="apple-touch-icon" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">

    <style>
        :root { --primary: #2ecc71; --bg: #f5f7fa; --txt: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--txt); display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { width: 60px; margin-bottom: 1rem; }
        .result-box { background: #ecf0f1; padding: 1.5rem; border-radius: 10px; margin-bottom: 1.5rem; }
        #soldeAffiche { font-size: 2.5rem; font-weight: bold; color: var(--primary); border: none; background: none; text-align: center; width: 100%; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .settings { text-align: left; border-top: 1px solid #ddd; margin-top: 1.5rem; padding-top: 1rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        #status { font-size: 0.8rem; margin-top: 10px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png" class="logo">
    <div class="result-box">
        <label>SOLDE ACTUEL ESTIMÉ</label>
        <input type="text" id="soldeAffiche" value="0 €">
        <button class="btn" onclick="sauvegarderVersGoogle()">ENREGISTRER SUR GOOGLE</button>
        <div id="status"></div>
    </div>

    <div class="settings">
        <div class="input-group">
            <label>ÉCONOMIE MENSUELLE (€)</label>
            <input type="number" id="ajoutMensuel" value="100" oninput="calculerAuto()">
        </div>
        <div class="input-group">
            <label>DATE DU DERNIER POINT</label>
            <input type="date" id="dateDerniereMaj" oninput="calculerAuto()">
        </div>
    </div>
</div>

<script>
    // TON LIEN GOOGLE SCRIPT RECUPÉRÉ SUR TA CAPTURE
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwGYxsbtRcfr34S8B-hv9yupQW2OP6N-teWYhf8hEWDMQFiKq6GmR-K4I3rFd45CSRI/exec';

    window.onload = function() {
        // Charger les données locales
        const soldeLocal = localStorage.getItem('monSolde') || "0";
        document.getElementById('soldeAffiche').value = soldeLocal + " €";
        document.getElementById('ajoutMensuel').value = localStorage.getItem('monAjout') || 100;
        document.getElementById('dateDerniereMaj').value = localStorage.getItem('maDate') || new Date().toISOString().split('T')[0];
        calculerAuto();
    }

    function calculerAuto() {
        let soldeBase = parseFloat(localStorage.getItem('monSolde')) || 0;
        let mensuel = parseFloat(document.getElementById('ajoutMensuel').value) || 0;
        let dateMaj = new Date(document.getElementById('dateDerniereMaj').value);
        let aujourdhui = new Date();

        let diffMois = (aujourdhui.getFullYear() - dateMaj.getFullYear()) * 12 + (aujourdhui.getMonth() - dateMaj.getMonth());
        if (diffMois < 0) diffMois = 0;

        let total = soldeBase + (diffMois * mensuel);
        document.getElementById('soldeAffiche').value = total + " €";
        localStorage.setItem('monAjout', mensuel);
    }

    function sauvegarderVersGoogle() {
        const btn = document.querySelector('.btn');
        const status = document.getElementById('status');
        let valeur = parseFloat(document.getElementById('soldeAffiche').value);
        let mensuel = document.getElementById('ajoutMensuel').value;
        let date = new Date().toISOString().split('T')[0];

        btn.innerText = "Envoi en cours...";
        status.innerText = "Connexion à Google Drive...";

        // Sauvegarde locale d'abord
        localStorage.setItem('monSolde', valeur);
        localStorage.setItem('maDate', date);
        document.getElementById('dateDerniereMaj').value = date;

        // Envoi vers Google Sheets
        fetch(`${scriptURL}?solde=${valeur}&mensuel=${mensuel}&date=${date}`)
        .then(response => {
            btn.innerText = "ENREGISTRER SUR GOOGLE";
            status.innerText = "✅ Sauvegardé sur ton compte Google !";
            setTimeout(() => { status.innerText = ""; }, 3000);
        })
        .catch(error => {
            btn.innerText = "ENREGISTRER SUR GOOGLE";
            status.innerText = "❌ Erreur réseau, mais gardé en mémoire locale.";
        });
    }
</script>

</body>
</html>
