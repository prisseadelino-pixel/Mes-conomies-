<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Économies</title>
    
    <link rel="icon" type="image/png" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">
    <link rel="apple-touch-icon" href="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png">

    <style>
        :root {
            --primary-color: #2ecc71;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-display { width: 60px; margin: 0 auto 1rem; }

        .result-box {
            background-color: #ecf0f1;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        /* Champ du solde modifiable */
        #soldeAffiche {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            background: transparent;
            border: none;
            text-align: center;
            width: 100%;
            outline: none;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .settings { text-align: left; border-top: 1px solid var(--border-color); padding-top: 1rem; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; font-weight: 600; }
        input { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://i49.servimg.com/u/f49/11/31/89/70/gemini10.png" alt="Logo" class="logo-display">
    <div class="result-box">
        <label>Solde actuel (modifiable)</label>
        <input type="text" id="soldeAffiche" value="0">
        <button class="btn-save" onclick="sauvegarderManuel()">Enregistrer ce montant</button>
    </div>

    <div class="settings">
        <div class="input-group">
            <label>Économie mensuelle (€)</label>
            <input type="number" id="ajoutMensuel" value="100" oninput="calculerAuto()">
        </div>
        <div class="input-group">
            <label>Dernière mise à jour</label>
            <input type="date" id="dateDerniereMaj" oninput="calculerAuto()">
        </div>
    </div>
</div>

<script>
    // Au chargement
    window.onload = function() {
        if(localStorage.getItem('monSolde')) {
            document.getElementById('soldeAffiche').value = localStorage.getItem('monSolde') + " €";
            document.getElementById('ajoutMensuel').value = localStorage.getItem('monAjout') || 100;
            document.getElementById('dateDerniereMaj').value = localStorage.getItem('maDate') || new Date().toISOString().split('T')[0];
        }
        calculerAuto();
    }

    function sauvegarderManuel() {
        let valeur = parseFloat(document.getElementById('soldeAffiche').value);
        if (isNaN(valeur)) return;
        
        localStorage.setItem('monSolde', valeur);
        localStorage.setItem('maDate', new Date().toISOString().split('T')[0]);
        document.getElementById('dateDerniereMaj').value = new Date().toISOString().split('T')[0];
        alert("Montant enregistré ! Les prochains calculs partiront d'ici.");
        calculerAuto();
    }

    function calculerAuto() {
        let soldeBase = parseFloat(localStorage.getItem('monSolde')) || 0;
        let mensuel = parseFloat(document.getElementById('ajoutMensuel').value) || 0;
        let dateMaj = new Date(document.getElementById('dateDerniereMaj').value);
        let aujourdhui = new Date();

        let diffMois = (aujourdhui.getFullYear() - dateMaj.getFullYear()) * 12 + (aujourdhui.getMonth() - dateMaj.getMonth());
        if (diffMois < 0) diffMois = 0;

        let total = soldeBase + (diffMois * mensuel);
        document.getElementById('soldeAffiche').value = total + " €";
        
        // Sauvegarde des réglages (mais pas du solde calculé)
        localStorage.setItem('monAjout', mensuel);
    }
</script>

</body>
</html>
